[package]
name = "claude-statusline"
version = "0.1.0"
edition = "2021"
description = "Native fast path for the Claude Code status line"

[[bin]]
name = "claude-statusline"
path = "src/main.rs"

# Optimize for a tiny, fast-starting binary (no deps, so this builds offline).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
